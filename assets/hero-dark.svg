<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Moddy — local-first software for Windows, Android and the browser">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EE6C8"/>
      <stop offset="0.55" stop-color="#1FBFA8"/>
      <stop offset="1" stop-color="#0E6B60"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.2" fill="#173A42" opacity="0.55"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0A1014"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect x="0" y="0" width="10" height="320" fill="url(#edge)"/>

    <!-- LCARS elbow, bottom-right -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1200 52 H1148 Q1112 52 1112 88 V238 Q1112 274 1076 274 H880"
            stroke="#113A40" stroke-width="44"/>
      <path d="M1200 52 H1148 Q1112 52 1112 88 V238 Q1112 274 1076 274 H880"
            stroke="#2EE6C8" stroke-width="5" opacity="0.85"/>
    </g>
    <g>
      <rect x="980" y="114" width="132" height="12" rx="6" fill="#FFB86B" opacity="0.85"/>
      <rect x="1012" y="160" width="100" height="12" rx="6" fill="#2EE6C8" opacity="0.5"/>
      <rect x="1044" y="206" width="68" height="12" rx="6" fill="#FFB86B" opacity="0.35"/>
    </g>

    <text x="64" y="104" fill="#EAF6F4"
          font-family="Segoe UI Variable Display, Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="62" font-weight="700" letter-spacing="9">MODDYS</text>

    <text x="66" y="146" fill="#2EE6C8"
          font-family="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace"
          font-size="15" letter-spacing="7">MODTECH WORKSHOP</text>

    <text x="66" y="204" fill="#A9C2C0"
          font-family="Segoe UI Variable Text, Segoe UI, Helvetica Neue, Arial, sans-serif"
          font-size="26" font-weight="400">Local-first software for Windows, Android and the browser.</text>

    <text x="66" y="252" fill="#FFB86B"
          font-family="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace"
          font-size="13" letter-spacing="3.4">NO ACCOUNTS &#183; NO TELEMETRY &#183; SOURCE WITH EVERY BINARY</text>

    <text x="66" y="294" fill="#5E7C7F"
          font-family="Cascadia Mono, Consolas, SFMono-Regular, Menlo, monospace"
          font-size="12" letter-spacing="2.6">RADIO &#183; SYNTHS &#183; SSH &#183; LIVE DATA &#183; THEMES</text>
